    - name: Eliminar cualquier linea que contenga los hostnames de NetBackup
      lineinfile:
        path: "{{ filehosts }}"
        regexp: '^.*?\b(vxnbucfs|cpdnbumedia3-le|cpdnbumedia6-le|lvprpbckrescc01-cfs)\b.*$'
        state: absent
  become: true