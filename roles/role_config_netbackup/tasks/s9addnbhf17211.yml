---
- block:
    # - name: Obtener IP Robótica o Datos para definir el sufijo del cliente
    #   set_fact:
    #     nbkchpiprbt: >-
    #       {{
    #         ansible_all_ipv4_addresses
    #         | select('regex', '^172[.](10|11|13)[.]')
    #         | list
    #       }}

    - name: Actualizar /etc/hosts para segmento 172.11.x.x
      blockinfile:
        path: "{{ filehosts }}"
        marker: "# {mark} ANSIBLE MANAGED NETBACKUP CFS 172.11"
        block: |
          172.11.110.84 vxnbucfs
          172.11.110.83 cpdnbumedia3-le
          172.11.110.87 cpdnbumedia6-le
          172.10.120.132 lvprpbckrescc01-cfs
          {{ nbkchpiprbt | first }} {{ nbcltsfx }}
      when: 
        - nbkchpiprbt | length > 0
        - nbkchpiprbt[0].startswith('172.11.')
      register: hosts_update_172_11 
  become: true

- name: Consolidar resultado de modificación en /etc/hosts
  set_fact:
    hosts_update:
      changed: "{{ hosts_update_172_11.changed | default(false) }}"