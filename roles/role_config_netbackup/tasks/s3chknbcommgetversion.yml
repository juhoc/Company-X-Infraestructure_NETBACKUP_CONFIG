---
- block:
    - name: Verificar si existe le archivo lectura version NetBackup
      stat:
        path: "{{ nbcommand }}"
      register: nbu_comm

    - set_fact:
        run_playbook: |
          {% if nbu_comm.stat.exists %}
          ['s3chknbcommgetversion','s5chkiprobotica']
          {% else %}
          ['s4msgnbcmfailed']
          {% endif %}
    
    - name: Ejecutar tareas NetBackup
      include_tasks: "{{ asbpbact2 }}.yml"
      loop: "{{ run_playbook | from_yaml }}"
      loop_control:
        loop_var: asbpbact2