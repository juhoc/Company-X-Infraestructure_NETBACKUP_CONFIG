---
- block:
    - name: Verificar si existe le archivo lectura version NetBackup
      stat:
        path: "{{ nbcommand }}"
      register: nbu_comm

    - name: Segunda condición, obtener archivo o comando versión NetBackup
      set_fact:
        run_playbook: |
          {% if nbu_comm.stat.exists %}
          ['s4getnbcommversion','s6chkiprobotica']
          {% else %}
          ['s5msgnbcmfailed']
          {% endif %}
    
    - name: Ejecutar tareas NetBackup en base a condiciones
      include_tasks: "{{ asbpbact2 }}.yml"
      loop: "{{ run_playbook | from_yaml }}"
      loop_control:
        loop_var: asbpbact2

