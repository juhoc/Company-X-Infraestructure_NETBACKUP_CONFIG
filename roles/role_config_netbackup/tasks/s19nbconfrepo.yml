---
- block:
    # - name: Generar reporte HTML de Certificación CFS
    #   template:
    #     src: templates/certificacion_cfs_report.html.j2
    #     dest: "/tmp/certificacion_cfs_{{ inventory_hostname }}.html"
    #   delegate_to: localhost
    #   become: false

    - name: Crear directorio de reporte_consolidado NetBackup CFS
      file:
        path: "{{ rutareporte }}"
        mode: " 0755"
        owner: "bvmuxat2"
        group: "bvmuxat2"
        state: "dorectory"

    - name: Generar Reporte Consolidado HTML para todos los nodos
      template:
        src: templates/consolidated_cfs_report.html.j2
        dest: "{{ rutareporte }}/reporte_{{ idhelix }}_consolidado_cfs_{{ ansible_date_time }}.html"
      # delegate_to: localhost
      # run_once: true
      # become: false

    - name: Enviar correo único con el Reporte Ejecutivo Consolidado
      community.general.mail:
        host: "{{ smtp_server }}"
        port: "{{ smtp_port }}"
        from: "{{ email_sender }}"
        to: "{{ email_recipients }}"
        subject: "[RESUMEN EJECUTIVO] Certificación NetBackup CFS - ({{ hostvars[ansible_play_hosts[0]]['ansible_date_time']['date'] }})"
        body: "{{ lookup('file', '{{ rutareporte }}/reporte_{{ idhelix }}_consolidado_cfs_{{ ansible_date_time }}.html') }}"
        subtype: html
      # delegate_to: localhost
      # run_once: true
      # become: true

    - name: Leer Reporte Consolidado HTML para todos los nodos
      shell: "cat {{ rutareporte }}/reporte_{{ idhelix }}_consolidado_cfs_{{ ansible_date_time }}.html"
      register: htmlrepotr
  delegate_to: "{{ srv_delegate }}"
  run_once: true
  become: false

- set_fact:
    htmlrepotsf: "{{ htmlrepotr.stdout_lines }}"

- block:
    - copy:
        content: "{{ htmlrepotsf | join('\n') }}"
        dest: "{{ rutareporte }}/reporte_{{ idhelix }}_consolidado_cfs_{{ ansible_date_time }}.html"
  run_once: true
  delegate_to: "{{ srv_delegate }}"
        