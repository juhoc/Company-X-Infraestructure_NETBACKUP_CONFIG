---
- block:
    - name: Verificar si existe le archivo lectura version NetBackup
      stat:
        path: /usr/openv/netbackup/bin/version
      register: nbu_file

    - set_fact:
        run_playbook: |
          {% if nbu_file.stat.exists %}
          ['s2chknbrvf','s4chknbipr']
          {% else %}
          ['s3chknbcvf']
          {% endif %}
    
    - name: Ejecutar tareas NetBackup
      include_tasks: "{{ asbpbact1 }}.yml"
      loop: "{{ run_playbook | from_yaml }}"
      loop_control:
        loop_var: asbpbact1